<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TECHNOCRAZIA VISUALS</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #030200;
            font-family: monospace;
            color: #ffb000;
        }

        #ui-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #preview-container {
            flex: 1;
            position: relative;
            background: #000;
            border-right: 1px solid #ffb000;
        }

        #swarm-matrix {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            will-change: transform;
        }

        #swarm-matrix:fullscreen {
            cursor: none;
            object-fit: contain;
            background: #000;
        }

        #swarm-matrix:-webkit-full-screen {
            cursor: none;
            object-fit: contain;
            background: #000;
        }

        #control-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            background: #030200;
            padding: 30px;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 1px solid #ffb000;
            padding-bottom: 15px;
            margin-top: 0;
            text-transform: uppercase;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 15px;
            border: 1px solid #ffb000;
        }

        .control-group label {
            font-weight: bold;
            font-size: 0.9rem;
        }

        select,
        button {
            padding: 15px 20px;
            font-family: monospace;
            font-size: 14px;
            background: none;
            color: #ffb000;
            border: 1px solid #ffb000;
            cursor: pointer;
            outline: none;
            width: 100%;
            text-transform: uppercase;
        }

        select option {
            background: #030200;
            color: #ffb000;
        }

        button:hover {
            background: #ffb000;
            color: #030200;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            background: #ffb000;
            cursor: pointer;
            margin-top: -8px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #443300;
        }

        /* --- SOVRANITÀ DELLE RISORSE E SATURAZIONE --- */
        body.is-fullscreen #control-panel {
            display: none !important;
        }

        body.is-fullscreen #preview-container {
            border-right: none !important;
        }
    </style>
</head>

<body>
    <div id="ui-container">
        <div id="preview-container">
            <canvas id="swarm-matrix"></canvas>
        </div>
        <div id="control-panel">
            <h1>DESIGN BY M4TE</h1>
            <div class="control-group">
                <label>AUDIO SOURCE</label>
                <select id="audio-input-select">
                    <option value="system">[ SYSTEM AUDIO / LOOPBACK ]</option>
                    <option value="default">[ DEFAULT MICROPHONE ]</option>
                </select>
                <button id="start-btn">[ START AUDIO CORE ]</button>
            </div>

            <div class="control-group" id="params-group" style="display:none;">
                <label>ZOOM / DEPTH</label>
                <input type="range" id="slider-zoom" min="-2000" max="4000" value="2800">

                <label>GLYPH SCALE</label>
                <input type="range" id="slider-scale" min="0.2" max="6.0" step="0.1" value="1.5">

                <label>ORBIT X (PRECESSION)</label>
                <input type="range" id="slider-orbit-x" min="-3.14" max="3.14" step="0.01" value="0">

                <label>ORBIT Y (SPIN)</label>
                <input type="range" id="slider-orbit-y" min="-3.14" max="3.14" step="0.01" value="0">

                <button id="btn-color-mode" style="margin-top: 15px;">[ COLOR: ON ]</button>
                <button id="btn-projector" style="margin-top: 15px;">[ FULLSCREEN ]</button>
            </div>
        </div>
    </div>

    <script src="coi-serviceworker.js"></script>
    <script type="module" src="logica/main.js"></script>
</body>

</html>
